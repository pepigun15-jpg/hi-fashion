<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" preserveAspectRatio="xMidYMid slice">
<defs>
 <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".38" stop-color="#f0f3f7"/><stop offset=".72" stop-color="#fff"/><stop offset="1" stop-color="#e6eaf0"/></linearGradient>
 <radialGradient id="center"><stop stop-color="#fff" stop-opacity=".97"/><stop offset=".56" stop-color="#fff" stop-opacity=".78"/><stop offset="1" stop-color="#fff" stop-opacity=".12"/></radialGradient>
 <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".48" stop-color="#cbd6e1"/><stop offset="1" stop-color="#fdfefe"/></linearGradient>
