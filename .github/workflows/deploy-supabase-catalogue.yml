name: Deploy HI FASHION catalogue functions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: nbluqcydijvjwcjzvank
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check deployment credentials
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN in GitHub repository Actions secrets."
            exit 1
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Add SUPABASE_DB_PASSWORD in GitHub repository Actions secrets to apply pending migrations."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Apply pending database migrations
        run: supabase db push --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Deploy protected feed importer
        run: supabase functions deploy import-retailer-feed --project-ref "$SUPABASE_PROJECT_ID" --yes

      - name: Deploy CJ catalogue search
        run: supabase functions deploy search-cj-catalogue --project-ref "$SUPABASE_PROJECT_ID" --yes

      - name: Deploy eBay catalogue search
        run: supabase functions deploy search-ebay-catalogue --project-ref "$SUPABASE_PROJECT_ID" --yes
