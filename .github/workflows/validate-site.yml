name: Validate HI FASHION
on:
  push:
    branches:
      - feature/global-categories-location-seasons
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate site scripts, navigation, product price gates and partner registries
        run: node scripts/validate-site.mjs
  browser-smoke:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start static storefront
        run: |
          python3 -m http.server 4173 > /tmp/hi-fashion-http.log 2>&1 &
          echo $! > /tmp/hi-fashion-http.pid
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/index.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/hi-fashion-http.log
          exit 1
      - name: Test homepage navigation, category links, account, cart and catalogue search
        run: node scripts/browser-smoke.mjs
